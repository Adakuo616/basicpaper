# 用指令部署時使用（npx wrangler deploy）。用 Cloudflare 網頁介面部署則不需要這個檔案。
name = "lab-ai-proxy"
main = "worker.js"
compatibility_date = "2024-09-23"

[vars]
ALLOWED_ORIGINS = "https://adakuo616.github.io,http://localhost:8000"
ALLOWED_MODELS = "gpt-5-mini,gpt-4.1-mini"
MAX_TOKENS = "4000"
# 機密資料不要寫在這裡，請用：npx wrangler secret put LAB_TOKEN、npx wrangler secret put OPENAI_API_KEY
